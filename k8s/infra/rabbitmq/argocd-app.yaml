apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq
  source:
    repoURL: https://github.com/cezarymostowiec/homelab-proxmox.git
    targetRevision: main
    path: k8s/infra/rabbitmq/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
