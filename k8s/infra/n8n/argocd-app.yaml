apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: n8n
    targetRevision: latest
    helm:
      valueFiles:
        - $values/k8s/infra/n8n/values.yaml

  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: n8n
      targetRevision: latest
    - repoURL: https://github.com/cezarymostowiec/homelab-proxmox.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
