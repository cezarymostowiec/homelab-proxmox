apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  sources:
    - repoURL: 8gears.container-registry.com/library
      chart: n8n
      targetRevision: 2.0.1
      helm:
        valueFiles:
          - $values/k8s/infra/n8n/values.yaml

    - repoURL: https://github.com/cezarymostowiec/homelab-proxmox.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
