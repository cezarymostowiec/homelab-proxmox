apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  sources:
    - repoURL: https://8gears.github.io/n8n-helm-chart/
      chart: n8n
      targetRevision: 0.18.0
      helm:
        valueFiles:
          - $values/k8s/infra/n8n/values.yaml

    - repoURL: https://github.com/cezarymostowiec/homelab-proxmox.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
