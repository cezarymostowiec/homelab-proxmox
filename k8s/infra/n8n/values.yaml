main:
  config:
    n8n:
      basicAuth:
        active: true
        user: admin
        password: admin123

  persistence:
    enabled: true
    size: 5Gi

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx

  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-cluster-issuer"

  hosts:
    - host: n8n.lab.local
      paths:
        - path: /
          pathType: Prefix

  tls:
    - hosts:
        - n8n.lab.local
      secretName: n8n-tls
