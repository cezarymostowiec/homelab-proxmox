apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: "7.2.1"
      helm:
        valueFiles:
          - $values/k8s/infra/velero/values.yaml
    - repoURL: https://github.com/cezarymostowiec/homelab-proxmox.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/cezarymostowiec/homelab-proxmox.git
      targetRevision: main
      path: k8s/infra/velero/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
