deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  structuredConfig:
    auth_enabled: false

    common:
      replication_factor: 1

    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage_config:
      aws:
        s3: http://loki-minio.loki.svc.cluster.local:9000
        bucketnames: chunks
        access_key_id: root-user
        secret_access_key: supersecretpassword
        s3forcepathstyle: true

    limits_config:
      allow_structured_metadata: true
      retention_period: 168h
      volume_enabled: true

    ingester:
      chunk_encoding: snappy

    querier:
      max_concurrent: 2

backend:
  replicas: 1

read:
  replicas: 1

write:
  replicas: 1

gateway:
  enabled: true
  service:
    type: ClusterIP

minio:
  enabled: true
  replicas: 1
  persistence:
    size: 5Gi

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false
