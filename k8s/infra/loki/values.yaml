deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  common:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  ingester:
    chunk_encoding: snappy

  querier:
    max_concurrent: 2

  pattern_ingester:
    enabled: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h

backend:
  replicas: 1

read:
  replicas: 1

write:
  replicas: 1

minio:
  enabled: true

gateway:
  enabled: true
  service:
    type: ClusterIP

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false
